  var names = ["emptyFields","normalizeFields","mergeFields","resolveConfig","configToStorage","aiRequest","buildChatUrl","throwAiError","pageBridge","GM_xmlhttpRequest"].filter(function (n) {
    try { return typeof window[n] === "undefined"; } catch (_e) { return true; }

  // const 不挂 window：通过调用验证常量可见
  var constsOk = false;
  try { constsOk = resolveConfig({}).baseUrl === DEFAULT_BASE_URL; } catch (_e) { constsOk = false; }
  document.title = (names.length === 0 && constsOk) ? "wired-ok" : "wired-fail:" + names.join(",") + (constsOk ? "" : ",consts");
