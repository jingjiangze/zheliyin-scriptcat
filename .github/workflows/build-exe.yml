name: build-installer-exe

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "extension/**"
      - "zheliyin-card-assistant.user.js"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed extension files as base64 payload
        shell: pwsh
        run: |
          $map = @{}
          Get-ChildItem -Path "extension" -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path "extension").Path.Length + 1).Replace('\', '/')
            $map[$rel] = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
          }
          $lines = @()
          $lines += "# Generated by GitHub Actions - do not edit manually."
          $lines += "`$script:Embedded = @{}"
          foreach ($k in $map.Keys) {
            $lines += "`$script:Embedded['$k'] = '$($map[$k])'"
          }
          $lines | Set-Content -Path "installer/embedded.generated.ps1" -Encoding UTF8
          Write-Host "Embedded files: $($map.Count)"

      - name: Combine installer source with embedded payload
        shell: pwsh
        run: |
          $src = Get-Content -Path "installer/installer.ps1" -Raw -Encoding UTF8
          $emb = Get-Content -Path "installer/embedded.generated.ps1" -Raw -Encoding UTF8
          # 注意事项：embedded 定义必须位于 installer 主体之前（PS 脚本按行顺序执行）
          ($emb + "`r`n" + $src) | Set-Content -Path "installer/installer.combined.ps1" -Encoding UTF8

      - name: Compile installer to single-file exe (ps2exe)
        shell: pwsh
        run: |
          # pwsh 7 已内置 NuGet provider，不需要 Install-PackageProvider
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module ps2exe -Force
          Invoke-PS2EXE -InputFile "installer/installer.combined.ps1" `
            -OutputFile "ZheliyinCardInstaller.exe" `
            -NoConsole `
            -Title "折立印名片套版助手 一键安装" `
            -Description "折立印名片套版助手 浏览器扩展一键安装器" `
            -Version "0.3.0.0"
          Get-Item "ZheliyinCardInstaller.exe" | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zheliyin-installer
          path: ZheliyinCardInstaller.exe
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZheliyinCardInstaller.exe
          generate_release_notes: true